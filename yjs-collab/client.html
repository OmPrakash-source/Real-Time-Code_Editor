<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Yjs + Monaco — Two Editors</title>
  <style>
    body, html { height: 100%; margin: 0; font-family: sans-serif; background: #1e1e1e; color: #fff; }
    #top { padding: 12px; display:flex; gap:12px; align-items:center; background:#2d2d2d; border-bottom: 1px solid #3e3e3e; }
    #roomLabel { font-weight:600; color: #ccc; }
    #roomId { background: #3c3c3c; border: 1px solid #555; color: #fff; padding: 4px 8px; border-radius: 4px; }
    #connectBtn { background: #0e639c; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    #connectBtn:disabled { opacity: 0.6; cursor: not-allowed; }
    #container { display:flex; height: calc(100% - 60px); gap:2px; box-sizing:border-box; }
    .editor-wrapper { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #3e3e3e; }
    .editor-wrapper:last-child { border-right: none; }
    .editor-header { background: #252526; padding: 8px 12px; font-size: 13px; font-weight: 600; color: #cccccc; border-bottom: 1px solid #3e3e3e; }
    .editor { flex:1; height:100%; }
    .small-note { font-size:13px; color:#aaa; margin-left:12px; }
  </style>
</head>
<body>
  <div id="top">
    <label id="roomLabel">Room:</label>
    <input id="roomId" value="room-1" />
    <button id="connectBtn">Connect</button>
    <span id="userInfo" class="small-note"></span>
  </div>

  <div id="container">
    <div class="editor-wrapper">
      <div class="editor-header">Screen A (Shared)</div>
      <div id="left" class="editor"></div>
    </div>
    <div class="editor-wrapper">
      <div class="editor-header">Screen B (Shared)</div>
      <div id="right" class="editor"></div>
    </div>
  </div>

  <!-- Monaco loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs/loader.min.js"></script>

  <script type="module">
    import * as Y from 'https://unpkg.com/yjs@13.5.42/dist/yjs.mjs';
    import { WebsocketProvider } from 'https://unpkg.com/y-websocket@1.4.7/dist/y-websocket.mjs';
    import { MonacoBinding } from 'https://unpkg.com/y-monaco@1.0.2/dist/y-monaco.mjs';

    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs' }});

    function createMonacoEditors(onReady) {
      require(['vs/editor/editor.main'], function () {
        const modelA = monaco.editor.createModel('// Screen A - Type here to sync with everyone\n', 'javascript');
        const modelB = monaco.editor.createModel('// Screen B - Type here to sync with everyone\n', 'javascript');

        const left = monaco.editor.create(document.getElementById('left'), {
          model: modelA,
          automaticLayout: true,
          minimap: { enabled: false },
          theme: 'vs-dark'
        });

        const right = monaco.editor.create(document.getElementById('right'), {
          model: modelB,
          automaticLayout: true,
          minimap: { enabled: false },
          theme: 'vs-dark'
        });

        onReady({ monaco, left, right, modelA, modelB });
      });
    }

    document.getElementById('connectBtn').addEventListener('click', async () => {
      const roomId = document.getElementById('roomId').value.trim() || 'room-1';
      document.getElementById('connectBtn').disabled = true;
      await start(roomId);
    });

    async function start(roomId) {
      createMonacoEditors(({ monaco, left, right, modelA, modelB }) => {
        const ydoc = new Y.Doc();
        const provider = new WebsocketProvider('ws://localhost:1234', roomId, ydoc);
        const awareness = provider.awareness;

        const userName = 'User ' + Math.floor(Math.random() * 1000);
        const userColor = '#' + Math.floor(Math.random()*16777215).toString(16);
        
        document.getElementById('userInfo').innerHTML = `You are <b>${userName}</b> <span style="color:${userColor}">●</span>`;

        awareness.setLocalStateField('user', {
          name: userName,
          color: userColor
        });

        const ytextA = ydoc.getText('editorA');
        const ytextB = ydoc.getText('editorB');

        const bindingA = new MonacoBinding(ytextA, modelA, new Set([left]), awareness);
        const bindingB = new MonacoBinding(ytextB, modelB, new Set([right]), awareness);

        console.log('Connected to room:', roomId, 'as', userName);
      });
    }

    document.getElementById('connectBtn').click();
  </script>
</body>
</html>
